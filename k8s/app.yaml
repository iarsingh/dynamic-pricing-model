apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamic-pricing-model
  labels:
    app: dynamic-pricing-model
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamic-pricing-model
  template:
    metadata:
      labels:
        app: dynamic-pricing-model
    spec:
      containers:
        - name: api
          image: dynamic-pricing-model:local
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: dynamic-pricing-model
spec:
  selector:
    app: dynamic-pricing-model
  ports:
    - port: 80
      targetPort: 8080
